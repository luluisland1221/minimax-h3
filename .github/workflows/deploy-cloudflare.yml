name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NEXT_PUBLIC_BASE_URL: https://minimaxh3.pro
      # Build-only placeholders. The deployed Worker uses the real values already
      # stored in Cloudflare; --keep-vars preserves those production variables.
      BETTER_AUTH_SECRET: github-actions-build-only-not-a-production-secret
      GOOGLE_CLIENT_ID: github-actions-build-only.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: github-actions-build-only
      NEON_DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      PLUNK_SECRET_KEY: github-actions-build-only
      PLUNK_PUBLIC_KEY: github-actions-build-only
      PLUNK_WEBHOOK_SECRET: github-actions-build-only
      MINIMAX_API_KEY: github-actions-build-only
      STRIPE_SECRET_KEY: sk_test_github_actions_build_only
      STRIPE_WEBHOOK_SECRET: whsec_github_actions_build_only
      # Stripe Price IDs are publishable identifiers embedded in the client bundle.
      NEXT_PUBLIC_STRIPE_PRICE_CREATOR_MONTHLY: price_1U12Uk0Cba9qUMRObvfZn2O3
      NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY: price_1U12Vc0Cba9qUMROQp0XJ1UK
      NEXT_PUBLIC_STRIPE_PRICE_STUDIO_MONTHLY: price_1U12W30Cba9qUMROz0gbKyBl
      NEXT_PUBLIC_STRIPE_PRICE_CREDITS_BOOST: price_1U12af0Cba9qUMROItdiklEs
      NEXT_PUBLIC_STRIPE_PRICE_CREDITS_MOMENTUM: price_1U12b60Cba9qUMROblA9AIC3
      NEXT_PUBLIC_STRIPE_PRICE_CREDITS_SCALE: price_1U12bQ0Cba9qUMRO6w2TIMoC
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm run build 2>&1 | tee next-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            diagnostic=$(tail -n 30 next-build.log | base64 -w 0)
            printf '::error title=Next build diagnostic (base64)::%s\n' "$diagnostic"
          fi
          exit "$status"

      - name: Convert build for Cloudflare Workers
        run: pnpm exec opennextjs-cloudflare build --skipNextBuild

      - name: Deploy production Worker
        run: pnpm exec opennextjs-cloudflare deploy -- --keep-vars
