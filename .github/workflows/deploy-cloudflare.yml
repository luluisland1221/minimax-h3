name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NEXT_PUBLIC_BASE_URL: https://minimaxh3.pro
      # Stripe Price IDs are publishable identifiers embedded in the client bundle.
      NEXT_PUBLIC_STRIPE_PRICE_CREATOR_MONTHLY: price_1U12Uk0Cba9qUMRObvfZn2O3
      NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY: price_1U12Vc0Cba9qUMROQp0XJ1UK
      NEXT_PUBLIC_STRIPE_PRICE_STUDIO_MONTHLY: price_1U12W30Cba9qUMROz0gbKyBl
      NEXT_PUBLIC_STRIPE_PRICE_CREDITS_BOOST: price_1U12af0Cba9qUMROItdiklEs
      NEXT_PUBLIC_STRIPE_PRICE_CREDITS_MOMENTUM: price_1U12b60Cba9qUMROblA9AIC3
      NEXT_PUBLIC_STRIPE_PRICE_CREDITS_SCALE: price_1U12bQ0Cba9qUMRO6w2TIMoC
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          required=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy production Worker
        run: pnpm exec wrangler deploy --keep-vars
