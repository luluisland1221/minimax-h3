name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NEXT_PUBLIC_BASE_URL: https://minimaxh3.pro
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PLUNK_SECRET_KEY: ${{ secrets.PLUNK_SECRET_KEY }}
      PLUNK_PUBLIC_KEY: ${{ secrets.PLUNK_PUBLIC_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_STRIPE_PRICE_CREATOR_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_CREATOR_MONTHLY }}
      NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY }}
      NEXT_PUBLIC_STRIPE_PRICE_STUDIO_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_STUDIO_MONTHLY }}
      NEXT_PUBLIC_STRIPE_PRICE_CREDITS_BOOST: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_CREDITS_BOOST }}
      NEXT_PUBLIC_STRIPE_PRICE_CREDITS_MOMENTUM: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_CREDITS_MOMENTUM }}
      NEXT_PUBLIC_STRIPE_PRICE_CREDITS_SCALE: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_CREDITS_SCALE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          required=(
            BETTER_AUTH_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
            NEON_DATABASE_URL PLUNK_SECRET_KEY PLUNK_PUBLIC_KEY
            MINIMAX_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
            NEXT_PUBLIC_STRIPE_PRICE_CREATOR_MONTHLY
            NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY
            NEXT_PUBLIC_STRIPE_PRICE_STUDIO_MONTHLY
            NEXT_PUBLIC_STRIPE_PRICE_CREDITS_BOOST
            NEXT_PUBLIC_STRIPE_PRICE_CREDITS_MOMENTUM
            NEXT_PUBLIC_STRIPE_PRICE_CREDITS_SCALE
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy production Worker
        run: pnpm exec wrangler deploy --keep-vars
